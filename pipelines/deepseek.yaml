port: 4004
host: 0.0.0.0
mode: smart

llm:
  main:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.7
    maxTokens: 8192
  classifier:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.1
  helper:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.1

mcp:
  - type: http
    url: ${MCP_ENDPOINT}

# The legacy named facts/feedback/state stores (pipeline.rag.{name}) have no
# current equivalent — a deployment gets one tools store; register extra named
# stores via a RAG plugin if you need them.
rag:
  store:
    type: in-memory
  embedder:
    provider: ollama
    url: http://localhost:11434
    model: bge-m3

agent:
  externalToolsValidationMode: permissive
  maxIterations: 10
  maxToolCalls: 30
  ragQueryK: 10
  showReasoning: false
  historyAutoSummarizeLimit: 10
  streamMode: final
  refreshToolsPerIteration: false
  toolReselectPerIteration: true

log: smart-server.log
logDir: sessions
