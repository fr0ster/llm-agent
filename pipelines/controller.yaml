# Controller pipeline — default all-sonnet template.
# The engine's role prompts are agnostic ("the live target system"); domain
# knowledge comes from the connected MCP tools + the skills RAG, not config. No
# per-role `hint` here — capable models (sonnet) need no extra scaffolding. For
# an example of a `hint` steering a WEAKER model, see `controller-mixed.yaml`.
port: 4010
host: 0.0.0.0
mode: smart

# Base main LLM (flat SmartServerLlmConfig — `provider` required so it is not
# parsed as a multi-model named map). The LLM provider is the inference backend
# and is INDEPENDENT of the target domain; SAP AI Core is used here only as the
# example LLM service. Service key comes from LLM_SERVICE_KEY in .env.
llm:
  provider: sap-ai-sdk
  model: ${LLM_MODEL:-anthropic--claude-4.6-sonnet}
  temperature: 0.7

mcp:
  type: http
  url: ${MCP_ENDPOINT}

# The controller's evaluator needs an embedder for distance-based target-state
# strategies (semantic-distance/auto). consumer-confirm needs none.
rag:
  store:
    type: in-memory
  embedder:
    provider: sap-ai-core
    model: text-embedding-3-small
    credentialRef: LLM   # the same SAP AI Core account as llm.main

pipeline:
  name: controller
  config:
    # Three subagent roles. Each names an optional `llm:` key; an omitted one
    # resolves the role's own name, which here means the same main instance
    # (same model for all three). No `hint` here — these are capable models.
    # Add an optional `hint:` under a role to give a WEAKER model extra
    # operational steering (how to plan/execute); see controller-mixed.yaml. The
    # dynamic counterpart — procedural skills pulled from a RAG collection — is a
    # separate mechanism, not configured via hint.
    subagents:
      evaluator: {}
      planner: {}
      executor: {}
    # planner selection is preset-encoded: `name: controller` = smart-executor.
    # (Removed `planner:` — use `name: controller-weak` for the weak-executor preset.)
    # consumer-confirm | semantic-distance | auto. A generous threshold keeps the
    # loop moving instead of asking to confirm the goal on every request.
    targetState: { strategy: auto, distanceThreshold: 0.7 }
    sessionMemory: { collection: session-memory }
    budgets: { maxSteps: 20, maxRetries: 3, maxRewinds: 5, maxToolCalls: 10 }

log: smart-server.log
logDir: sessions
