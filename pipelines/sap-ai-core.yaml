port: 4004
host: 0.0.0.0
mode: smart

llm:
  main:
    provider: sap-ai-sdk
    model: ${LLM_MODEL:-anthropic--claude-4.6-sonnet}
    temperature: 0.7
    maxTokens: 32768
  classifier:
    provider: sap-ai-sdk
    model: ${LLM_MODEL:-anthropic--claude-4.6-sonnet}
    temperature: 0.1
  helper:
    provider: sap-ai-sdk
    model: ${LLM_MODEL:-anthropic--claude-4.6-sonnet}
    temperature: 0.1

mcp:
  - type: http
    url: ${MCP_ENDPOINT}

# The legacy named facts/feedback/state stores (pipeline.rag.{name}) have no
# current equivalent — a deployment gets one tools store; register extra named
# stores via a RAG plugin if you need them.
rag:
  store:
    type: in-memory
  embedder:
    provider: sap-ai-core
    model: text-embedding-3-small
    credentialRef: LLM   # the same SAP AI Core account as llm.main

agent:
  externalToolsValidationMode: permissive
  maxIterations: 10
  maxToolCalls: 30
  ragQueryK: 10
  showReasoning: false
  historyAutoSummarizeLimit: 10
  streamMode: final
  refreshToolsPerIteration: false
  toolReselectPerIteration: true
  retry:
    maxAttempts: 3
    retryOnMidStream:
      - 'SSE stream'

log: smart-server.log
logDir: sessions
