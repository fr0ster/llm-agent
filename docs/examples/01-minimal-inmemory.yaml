# Minimal local start — DeepSeek + in-memory RAG, no MCP.
# Simplest possible setup for quick experimentation.
#
# Usage:
#   LLM_API_KEY=sk-xxx npm run dev -- --config docs/examples/01-minimal-inmemory.yaml

port: 4004
host: 0.0.0.0
mode: smart

llm:
  provider: deepseek
  model: deepseek-chat
  temperature: 0.7

rag:
  store:
    type: in-memory
