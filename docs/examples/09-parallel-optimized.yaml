# Flat pipeline (v19+) — parallel-optimized tuning via agent: knobs.
#
# DefaultPipeline parallelizes the RAG queries internally. Automatic history
# summarization is removed; the legacy summarize stage is a deprecated no-op.
# Per-request retrieval tuning uses the top-level agent block.
#
# Internal flow:
#   classify -> [rag-tools, rag-history](parallel) -> rerank
#   -> skill-select -> tool-select -> assemble -> tool-loop -> history-upsert
#
# Usage:
#   LLM_API_KEY=sk-xxx npm run dev -- --config docs/examples/09-parallel-optimized.yaml

port: 4004
host: 0.0.0.0
mode: smart

llm:
  provider: deepseek
  model: deepseek-chat
  temperature: 0.7
  classifierTemperature: 0.1

rag:
  store:
    type: in-memory
    dedupThreshold: 0.92
    vectorWeight: 0.7
    keywordWeight: 0.3
  embedder:
    provider: ollama
    url: http://localhost:11434
    model: bge-m3

mcp:
  type: http
  url: http://localhost:3001/mcp/stream/http

logDir: sessions # session debug logs (RAG scores, tool selection)

agent:
  maxIterations: 10
  maxToolCalls: 30
  ragQueryK: 20
  classificationEnabled: true
  queryExpansionEnabled: true
  # historyAutoSummarizeLimit: 10  # Deprecated no-op; full history is kept.
