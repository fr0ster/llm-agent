name: Release

# npm publishing and signed tag creation remain manual.
on:
  push:
    tags: ['@mcp-abap-adt/*@*', 'v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract package release notes
        if: startsWith(github.ref_name, '@mcp-abap-adt/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/package-release-notes.mjs "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Create package GitHub release
        if: startsWith(github.ref_name, '@mcp-abap-adt/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: false

      - name: Create historical GitHub release
        if: startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
